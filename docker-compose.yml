services:
  workout-app:
    image: ghcr.io/looselycoupled/workout-webapp:latest
    ## To build from source instead, replace the image line with: build: .
    container_name: workout-tracker
    ports:
      - "8080:5000"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
    restart: unless-stopped
